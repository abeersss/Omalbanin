<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="أم البنين">
  <!--
    The eight-pointed star (النجمة الثمانية / رُبع الحزب): two squares laid over
    each other at 45 degrees. It is the same geometric motif already tiled in
    the site background, so the icon and the page read as one thing, and it is
    purely geometric - no figure, no calligraphy of a name that would be wrong
    to shrink to 16 pixels.

    Only two shapes and one ring, because the browser tab renders this at 16px
    and anything finer turns to mush at that size.
  -->
  <rect width="64" height="64" rx="14" fill="#14584a"/>
  <g transform="translate(32 32)">
    <g fill="#e6c47c">
      <rect x="-17" y="-17" width="34" height="34" rx="3"/>
      <rect x="-17" y="-17" width="34" height="34" rx="3" transform="rotate(45)"/>
    </g>
    <circle r="7.5" fill="#14584a"/>
  </g>
</svg>
