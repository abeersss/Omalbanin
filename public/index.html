<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<title>أم البنين | Omalbnin</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="canonical" href="https://omalbnin.com/ar/" />
<link rel="alternate" hreflang="ar" href="https://omalbnin.com/ar/" />
<link rel="alternate" hreflang="en" href="https://omalbnin.com/en/" />
<link rel="alternate" hreflang="x-default" href="https://omalbnin.com/ar/" />
<meta http-equiv="refresh" content="0; url=/ar/" />
<script>
  (function () {
    try {
      var saved = localStorage.getItem('omalbnin-locale');
      var lang = saved || (navigator.language || '').toLowerCase().startsWith('en') ? 'en' : 'ar';
      if (saved) lang = saved;
      location.replace('/' + lang + '/' + location.search + location.hash);
    } catch (e) {
      location.replace('/ar/');
    }
  })();
</script>
</head>
<body>
  <p>
    <a href="/ar/">العربية</a> - <a href="/en/">English</a>
  </p>
</body>
</html>
